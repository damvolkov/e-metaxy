##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs", "scripts"]

##### RULES #####
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

##### LAYERS #####
# Ordered high → low: a layer may import lower layers, importing upward fails. The bridge (logic) sees ports and
# models only; adapters and the MCP edge depend on it, never the reverse; main is the composition root.
layers = ["root", "edge", "logic", "models", "adapters", "core", "ops"]

[rules]
unused_ignore_directives = "error"

##### MODULES #####
[[modules]]
path = "e_metaxy"
layer = "root"
depends_on = []

[[modules]]
path = "e_metaxy.mcp"
layer = "edge"
depends_on = []

[[modules]]
path = "e_metaxy.adapters"
layer = "edge"
depends_on = []

[[modules]]
path = "e_metaxy.config"
layer = "edge"
depends_on = []

[[modules]]
path = "e_metaxy.logic"
layer = "logic"
depends_on = []

[[modules]]
path = "e_metaxy.models"
layer = "models"
depends_on = []

[[modules]]
path = "adapters"
layer = "adapters"
depends_on = []

[[modules]]
path = "core"
layer = "core"
depends_on = []

[[modules]]
path = "ops"
layer = "ops"
depends_on = []

##### ROOTS #####
source_roots = ["src"]
exclude = ["tests", "docs"]

##### RULES #####
forbid_circular_dependencies = true
### the table below is the import table of the taxonomy, spelled edge by edge: an import that is not an edge fails. `exact`
### stays off because the table declares what a layer MAY import (every execution module may reach `ops`, none does yet);
### the graph itself — no edge between engines, processors, drivers and adapters, none upward — is what the gate holds.
exact = false
root_module = "forbid"

[rules]
unused_ignore_directives = "error"

##### SERVICE #####
### the service stands on the materialized sections and on its own models; nothing materialized imports it back.
[[modules]]
path = "e_organon"
depends_on = ["e_organon.api", "e_organon.api.lifespan", "e_organon.mcp", "e_organon.websockets", "infra", "infra.auth", "infra.mcp"]

[[modules]]
path = "e_organon.api"
depends_on = [
    "e_organon.models",
    "e_organon.services",
    "engines",
    "providers.drivers",
    "providers.adapters",
    "ports",
    "infra",
    "infra.auth",
    "infra.errors",
    "ops",
]

### the composition root's lifespans stand on every section and on the MCP door they build the server of; the door reads
### the graph's typed state back from `e_organon.api`, which is why the lifespans are a module of their own.
[[modules]]
path = "e_organon.api.lifespan"
depends_on = [
    "e_organon.api",
    "e_organon.mcp",
    "e_organon.services",
    "engines",
    "processors",
    "providers.drivers",
    "providers.adapters",
    "ports",
    "infra",
    "infra.auth",
    "infra.mcp",
    "infra.errors",
    "ops",
]

[[modules]]
path = "e_organon.mcp"
depends_on = ["e_organon.api", "e_organon.models", "engines", "ports", "infra", "infra.auth", "infra.mcp", "infra.errors"]

[[modules]]
path = "e_organon.websockets"
depends_on = ["e_organon.api", "e_organon.models", "infra", "infra.errors"]

[[modules]]
path = "e_organon.models"
depends_on = ["infra", "infra.errors"]

### the canonical tools: each a workflow over ports, the engines and processors it composes, and its section's models.
### Services name no concretion — the lifespans hand them what meets each port.
[[modules]]
path = "e_organon.services"
depends_on = ["e_organon.models", "engines", "processors", "ports", "infra", "infra.errors", "ops"]

##### MATERIALIZED #####
### engines, processors, drivers and adapters are the execution level: each stands on ports, infra and ops, and none
### lists another — the horizontal ban is the absence of an edge.
[[modules]]
path = "engines"
depends_on = ["ports", "infra", "infra.auth", "infra.errors", "ops"]

[[modules]]
path = "processors"
depends_on = ["ports", "infra", "infra.errors", "ops"]

[[modules]]
path = "providers.drivers"
depends_on = ["ports", "infra", "infra.auth", "infra.errors", "ops"]

[[modules]]
path = "providers.adapters"
depends_on = ["ports", "infra", "infra.errors", "ops"]

### ports are the bottleneck of the import graph: they see infra and nothing else.
[[modules]]
path = "ports"
depends_on = ["infra", "infra.auth", "infra.errors"]

[[modules]]
path = "infra"
depends_on = ["ops", "infra.errors"]

### the opt-in infra packages look only down: nothing in `infra` proper imports them, and the MCP engine rides the auth package.
[[modules]]
path = "infra.auth"
depends_on = ["infra", "infra.errors"]

[[modules]]
path = "infra.mcp"
depends_on = ["infra", "infra.auth", "infra.errors"]

### the error tree is the floor of the package: every module, `ops` included, raises from it and it imports nothing.
[[modules]]
path = "infra.errors"
depends_on = []

[[modules]]
path = "ops"
depends_on = ["infra.errors"]

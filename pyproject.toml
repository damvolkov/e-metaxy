##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14.1"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-organon"
dynamic = ["version"]
description = "e-organon: canonical deterministic tools for agents — REST, streaming and MCP over workflows"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    ##### common, whole: organon wires every section (2026-11-04) #####
    "pyyaml>=6.0",
    "pgqueuer[asyncpg]>=1.6",
    "awa-pg>=0.6.9",
    "theine>=2.0",
    "tokenizers>=0.23",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    ##### core #####
    "litestar>=2.24",
    "granian[reload]>=2.7",
    "asgi-correlation-id>=5.0",
    "structlog>=26.1",
    ### the MCP door: the official SDK speaks the protocol (infra/mcp/server only), litestar serves its tools as routes.
    "mcp>=2.3",
    ### the MCP SDK parses forms through starlette, which needs it.
    "python-multipart>=0.0.32",
    ##### data #####
    "msgspec>=0.21",
    ### ops/registry dumps through it; the compose loader of the whole stack.
    "e-serde>=0.6.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    ##### crypto #####
    "joserfc>=1.7.5",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "anyio>=4.15.1",
    ##### http #####
    "wreq>=0.10",
    ##### stores #####
    "redis>=6.2",
    "aiosqlite>=0.20",
    ### the db lifespan provisions the databases the settings name: CREATE DATABASE, outside any transaction.
    "psqlpy>=0.12",
    ##### queue clock — the in-process supervisor's schedules (infra/background) #####
    "croniter>=6.0",
    ##### web — rtrafilatura: a page's main content (providers/adapters/rtrafilatura) #####
    "rtrafilatura>=0.2",
    "beartype>=0.22.9",
    ##### documents — liteparse (Rust, in-process) first, docling-serve for what it reads better; polars frames #####
    "liteparse>=2.14",
    "anytomd[full]>=1.3.1.post2,<1.5",
    "tree-sitter-language-pack>=1.22",
    "lingua-language-detector>=2.2",
    "watchfiles>=1.3.0",
    "polars>=2.0",
    "pikepdf>=10.17.0",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    ##### images — zxing-cpp (C++, abi3 wheels): barcodes read and written #####
    "zxing-cpp>=3.1.1",
    ##### tekton — Claude Code as a coder: the Agent SDK runs a spec, a `claude mcp serve` child reaches live sessions #####
    "claude-agent-sdk>=0.2.164",
    "opencv-python-headless>=5.0.0.93",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.1",
    "pyhanko>=0.38.0",
    "typst>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/damvolkov/e-arkhetypo"
Source = "https://github.com/damvolkov/e-arkhetypo"
Issues = "https://github.com/damvolkov/e-arkhetypo/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "pytest-stress>=1.0.1",
    ### the MCP door's tests drive the SDK's own client over an ASGI transport, in process.
    "httpx2>=2.13",
    ### no [serde] extra: it pins e-serde<0.6 and the main dependency (ops/registry) needs >=0.6.1, which the plugin loads through.
    "pytest-resources>=0.3.2",
    "tiktoken>=0.14.0",
]
docs = [
    "mkdocstrings[python]>=1.0.7",
    "zensical>=0.0.70",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    "prek>=0.4",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
### first-party packages (pytest-resources, e-serde) and fast-shipping Rust bindings publish same-day: exempt them from the freshness guard.
exclude-newer-package = { "pytest-resources" = "2100-01-01T00:00:00Z", "e-serde" = "2100-01-01T00:00:00Z", "anytomd" = "2100-01-01T00:00:00Z", "liteparse" = "2100-01-01T00:00:00Z", "openai" = "2100-01-01T00:00:00Z", "rtrafilatura" = "2100-01-01T00:00:00Z" }
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/e_organon"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
### tests inject fixtures by parameter: a test takes as many as it needs.
### S108: the tekton profiles admit `/tmp`, so tests name it.
"tests/**" = ["S101", "S106", "S108", "PLR2004", "ARG", "FBT", "PLR0917"]
"scripts/**" = ["T20", "S603", "S607", "PTH"]
### litestar and msgspec resolve annotations at runtime — type-checking imports would break them.
"src/e_organon/api/**" = ["TC001", "TC002", "TC003"]
"src/e_organon/websockets/**" = ["TC001", "TC002", "TC003"]
"src/e_organon/models/**" = ["TC001", "TC002", "TC003"]
"src/e_organon/main.py" = ["TC001", "TC002", "TC003"]
"src/e_organon/mcp/**" = ["TC001", "TC002", "TC003"]
### the one module that speaks the MCP protocol: an SDK upgrade touches it alone.
"src/e_organon/infra/mcp/server.py" = ["TID251"]
### NON_SERVICE is an exclusion vocabulary for host tokens, not a socket bind.
"src/e_organon/ops/compose.py" = ["S104"]
"src/e_organon/providers/adapters/language/lingua.py" = ["TID251"]
### the stand-in `claude mcp serve` the coder driver's tests spawn: an MCP server by nature.
"tests/resources/bin/claude.py" = ["TID251"]
"src/e_organon/providers/adapters/watch/watchfiles.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["e_organon"]

[tool.ruff.lint.flake8-type-checking]
### pydantic and msgspec resolve these classes' annotations at runtime: their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "e_organon.infra.config.base.BaseSettings",
    "msgspec.Struct",
    "e_organon.infra.struct.CheckedStruct",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mcp.server".msg = "the MCP SDK's server is the engine's protocol (infra/mcp/server): an upgrade touches that one module"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
### tests on the path beside src: `from support.psqlpy import FakePsqlpyServer`, the fakes the mirror shares.
pythonpath = ["src", "tests"]
strict = true
filterwarnings = [
    "error",
    ### joserfc warns on every EdDSA JWT per RFC 9864 (non-committing signature); kept as an offered alg.
    "ignore::joserfc.errors.SecurityWarning",
]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "stress: concurrent-load tests, soaken for a duration with `make stress` (pytest-stress)",
    "integration: needs a real service (Postgres, redis, an IdP) and stays out of the default run: `make integration`",
]

##### COVERAGE #####
[tool.coverage.run]
### infra/, ops/, ports/, providers/, engines/ and processors/ are materialized and tested at their source (projects/python/common); the gate covers the service.
source_pkgs = ["e_organon"]
omit = ["src/e_organon/engines/*", "src/e_organon/infra/*", "src/e_organon/ops/*", "src/e_organon/ports/*", "src/e_organon/processors/*", "src/e_organon/providers/*"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']

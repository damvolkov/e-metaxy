##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-metaxy"
dynamic = ["version"]
description = "The in-between: an MCP gateway that carries tasks from polymath harnesses (OpenHuman) to engineer harnesses (Claude Code, OpenCode) and their results back"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack", "mcp", "claude-code", "agents"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    ##### bridge #####
    "mcp>=2.3",
    "claude-agent-sdk>=0.2.164",
    "granian>=2.7",
    ##### core #####
    "structlog>=26.1",
    "msgspec>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "beartype>=0.22.9",
    "anyio>=4.15.1",
    ##### crypto (materialized core) #####
    "joserfc>=1.7.5",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    ##### edges #####
    "wreq>=0.12",
    "aiosqlite>=0.20",
    ##### telemetry (materialized core) #####
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
]

[project.scripts]
e-metaxy = "e_metaxy.__main__:main"

[project.urls]
Homepage = "https://github.com/damvolkov/e-metaxy"
Source = "https://github.com/damvolkov/e-metaxy"
Issues = "https://github.com/damvolkov/e-metaxy/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "pytest-httpserver>=1.1",
    "httpx2>=2.13",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.4",
    ### structural rewrite of systems/core at materialization time (scripts/materialize.py); parses real 3.14 syntax.
    "libcst>=1.9",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/e_metaxy", "src/core", "src/ops", "src/adapters"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "profiles.yaml"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
### fixtures root profiles under /tmp on purpose; parametrized tests take one argument per column.
"tests/**" = ["S101", "S106", "S108", "PLR2004", "PLR0917", "ARG", "FBT"]
"scripts/**" = ["T20", "S603", "S607", "PTH"]
### msgspec and the mcp SDK resolve annotations at runtime — type-checking imports would break them.
"src/e_metaxy/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["e_metaxy", "core", "ops", "adapters"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "core.settings.base.BaseSettings",
    "msgspec.Struct",
    "core.struct.CheckedStruct",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
### the materialized core is type-checked at its source (e-templates systems/core); its copies are not edited here.
exclude = ["src/core", "src/adapters", "src/ops"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not live"]
pythonpath = ["src", "tests/unit"]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "live: drives the real Claude Code login on this host (run with `make live`)",
]

##### COVERAGE #####
[tool.coverage.run]
### core/, ops/ and adapters/ are materialized and tested at their source (systems/core); the gate covers the service.
source_pkgs = ["e_metaxy"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']

##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-metaxy"
dynamic = ["version"]
description = "The in-between: an MCP gateway that carries tasks from polymath harnesses (OpenHuman) to engineer harnesses (Claude Code, OpenCode) and their results back"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["e-stack", "mcp", "claude-code", "agents"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    ##### bridge #####
    "mcp>=2.3",
    "claude-agent-sdk>=0.2.164",
    ##### web — one litestar app serves the REST door and mounts the MCP one #####
    "litestar>=2.24",
    "granian>=2.7",
    "asgi-correlation-id>=5.0",
    ##### processors (materialized common set) — liteparse reads PDFs in-process, polars frames the deep doc #####
    "liteparse>=2.14",
    "polars>=2.0",
    ### 1.4 drops `detect_format`, which the materialized MDProcessor calls: the pin moves with projects/python/core.
    "anytomd[full]>=1.4.2,<1.5",
    ##### core #####
    "structlog>=26.1",
    "msgspec>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "beartype>=0.22.9",
    "anyio>=4.15.1",
    ##### crypto (materialized core) #####
    "joserfc>=1.7.5",
    "cryptography>=50.0.1",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    ##### edges #####
    "wreq>=0.12",
    "aiosqlite>=0.20",
    ##### telemetry (materialized core) #####
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    ### the SDK's OAuth endpoints parse their forms through starlette, which needs it.
    "python-multipart>=0.0.32",
]

[project.scripts]
e-metaxy = "e_metaxy.__main__:main"

[project.urls]
Homepage = "https://github.com/damvolkov/e-metaxy"
Source = "https://github.com/damvolkov/e-metaxy"
Issues = "https://github.com/damvolkov/e-metaxy/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "pytest-httpserver>=1.1",
    "httpx2>=2.13",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.4",
    ### structural rewrite of projects/python/core at materialization time (scripts/materialize.py); parses real 3.14 syntax.
    "libcst>=1.9",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "2026-10-20"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/e_metaxy"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "profiles.yaml"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
### the materialized common set is linted at its source (projects/python/core); its copies under e_metaxy must stay
### byte-identical to the generator, so ruff never touches them (else `make core-check` reports drift).
### e-metaxy's own modules inside those sections (the lifespan chain, the middleware stack, two settings scopes, three
### adapters) are linted here: the globs name the copies, never a whole section.
extend-exclude = [
    "src/e_metaxy/core/{crypto,errors,logger,proxy,state,struct}.py",
    "src/e_metaxy/core/settings/{__init__,agent,api,app,base,cli,crypto,darts,db,docling,doc,docs,http,md,oauth,otel,redis,theme,ui}.py",
    "src/e_metaxy/ops",
    "src/e_metaxy/processors",
    "src/e_metaxy/adapters/{anytomd,base,docling,http,otel,ports,sqlite}.py",
]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
### fixtures root profiles under /tmp and sign in with fixed passphrases; parametrized tests take one argument per column.
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "PLR0917", "ARG", "FBT"]
"scripts/**" = ["T20", "S603", "S607", "PTH"]
### msgspec and the mcp SDK resolve annotations at runtime — type-checking imports would break them.
"src/e_metaxy/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["e_metaxy"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "e_metaxy.core.settings.base.BaseSettings",
    "msgspec.Struct",
    "e_metaxy.core.struct.CheckedStruct",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
### the common set is materialized and type-checked at its source (e-arkhetypo projects/python/core); its copies
### under e_metaxy are not edited or checked here — e-metaxy's own modules inside those sections are.
exclude = [
    "src/e_metaxy/core/*",
    "!src/e_metaxy/core/lifespan",
    "!src/e_metaxy/core/middlewares.py",
    "!src/e_metaxy/core/settings",
    "src/e_metaxy/core/settings/*",
    "!src/e_metaxy/core/settings/authority.py",
    "!src/e_metaxy/core/settings/metaxy.py",
    "src/e_metaxy/ops",
    "src/e_metaxy/processors",
    "src/e_metaxy/adapters/anytomd.py",
    "src/e_metaxy/adapters/base.py",
    "src/e_metaxy/adapters/http.py",
    "src/e_metaxy/adapters/otel.py",
    "src/e_metaxy/adapters/sqlite.py",
    "src/e_metaxy/adapters/ports.py",
    "src/e_metaxy/adapters/docling.py",
]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not live"]
pythonpath = ["src", "tests/unit"]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "live: drives the real Claude Code login on this host (run with `make live`)",
]

##### COVERAGE #####
[tool.coverage.run]
### the common set (core, ops, processors, the copied adapters) is materialized and tested at its source
### (projects/python/core); the gate covers only the service — its edges, logic, models, lifespans and own adapters.
source_pkgs = ["e_metaxy"]
branch = true
parallel = true
### e-metaxy's own modules inside those sections (lifespans, middlewares, settings scopes) stay under the gate.
omit = [
    "*/e_metaxy/core/crypto.py",
    "*/e_metaxy/core/errors.py",
    "*/e_metaxy/core/logger.py",
    "*/e_metaxy/core/proxy.py",
    "*/e_metaxy/core/state.py",
    "*/e_metaxy/core/struct.py",
    "*/e_metaxy/core/settings/__init__.py",
    "*/e_metaxy/core/settings/agent.py",
    "*/e_metaxy/core/settings/api.py",
    "*/e_metaxy/core/settings/app.py",
    "*/e_metaxy/core/settings/base.py",
    "*/e_metaxy/core/settings/cli.py",
    "*/e_metaxy/core/settings/crypto.py",
    "*/e_metaxy/core/settings/darts.py",
    "*/e_metaxy/core/settings/db.py",
    "*/e_metaxy/core/settings/docling.py",
    "*/e_metaxy/core/settings/doc.py",
    "*/e_metaxy/core/settings/docs.py",
    "*/e_metaxy/core/settings/http.py",
    "*/e_metaxy/core/settings/md.py",
    "*/e_metaxy/core/settings/oauth.py",
    "*/e_metaxy/core/settings/otel.py",
    "*/e_metaxy/core/settings/redis.py",
    "*/e_metaxy/core/settings/theme.py",
    "*/e_metaxy/core/settings/ui.py",
    "*/e_metaxy/ops/*",
    "*/e_metaxy/processors/*",
    "*/e_metaxy/adapters/anytomd.py",
    "*/e_metaxy/adapters/base.py",
    "*/e_metaxy/adapters/docling.py",
    "*/e_metaxy/adapters/http.py",
    "*/e_metaxy/adapters/otel.py",
    "*/e_metaxy/adapters/ports.py",
    "*/e_metaxy/adapters/sqlite.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']

##### UV #####

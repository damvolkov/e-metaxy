##### RELEASE #####
# Git-first release: one version per tag (vX.Y.Z), one image — ghcr.io/damvolkov/e-metaxy.
# Manual gate like every house service: nothing is published by a merge.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        default: patch
        options: [patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: version + tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.next.outputs.ref }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: next
        name: next version, tag pushed, release opened
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          base="${last#v}"
          [ -n "$base" ] || base=0.0.0
          IFS=. read -r M m p <<< "$base"
          case "$BUMP" in
            major) M=$((M+1)); m=0; p=0 ;;
            minor) m=$((m+1)); p=0 ;;
            *) p=$((p+1)) ;;
          esac
          version="$M.$m.$p"
          git tag "v${version}"
          auth="AUTHORIZATION: basic $(printf '%s:%s' 'x-access-token' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${auth}" push origin "v${version}"
          notes=("--generate-notes")
          [ -n "$last" ] && notes+=("--notes-start-tag" "$last")
          gh release create "v${version}" --title "e-metaxy ${version}" --latest --verify-tag "${notes[@]}"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  image:
    name: image
    needs: bump
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/e-metaxy:${{ needs.bump.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/e-metaxy:latest
          labels: |
            org.opencontainers.image.title=e-metaxy
            org.opencontainers.image.description=MCP gateway from polymath harnesses to engineer harnesses (Claude Code)
          cache-from: type=gha
          cache-to: type=gha,mode=max

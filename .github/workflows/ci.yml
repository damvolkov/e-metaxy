name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # feature: ci-basics
  quality:
    name: lint · types · arch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Static gates
        run: |
          uv sync --group lint --no-install-project
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run ty check
          uv run tach check
          uv run validate-pyproject pyproject.toml
      - name: Workflow hardening scan
        run: uv run zizmor --persona=regular .github/workflows

  # feature: ci-basics
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        ### a Linux service in a container: awa-pg (the queue) ships no Windows wheel.
        os: [ubuntu-latest, macos-latest]
        python: ['3.14']
    # a push to main re-runs what its pull request already proved: tests run on pull requests only.
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # the merge commit's first parent is the base: a change of docs alone (docs/, *.md, zensical.toml) tests nothing.
      - name: What the change touches
        id: changes
        shell: bash
        run: |
          touched=$(git diff --name-only HEAD^1 HEAD | grep -vE '^docs/|\.md$|^zensical\.toml$' | head -1 || true)
          echo "code=$([ -n "$touched" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.changes.outputs.code == 'true'
      - name: Sync env
        if: steps.changes.outputs.code == 'true'
        run: uv sync --python ${{ matrix.python }}
      - name: Unit tests + coverage gate
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          uv run pytest -m "not slow and not integration" --cov --cov-report=term 2>&1 | tee ci-logs/build-test.log
      - name: Keep the log for ai-fix
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-logs-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-logs/

  # feature: docs
  docs:
    name: docs build
    # on a push to main the build only matters where it deploys: a public repo's Pages.
    if: github.event_name == 'pull_request' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Strict build (fails on broken links or missing assets)
        run: |
          uv sync --group docs --no-install-project
          uv run zensical build --strict
      - name: Stage site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  # feature: docs
  pages:
    name: pages deploy
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1


##### HOOKS #####
[[repos]]
repo = "local"
hooks = [
    { id = "ruff", name = "ruff check + format", entry = "uv run ruff check --fix --exit-non-zero-on-fix", language = "system", types_or = ["python", "pyi"], exclude = "src/e_metaxy/(core|ops|processors)/|src/e_metaxy/adapters/(base|http|otel|ports|sqlite|docling|vision)\\.py|src/e_metaxy/adapters/md/" },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format", language = "system", types_or = ["python", "pyi"], exclude = "src/e_metaxy/(core|ops|processors)/|src/e_metaxy/adapters/(base|http|otel|ports|sqlite|docling|vision)\\.py|src/e_metaxy/adapters/md/" },
    { id = "ty", name = "ty type check", entry = "uv run ty check", language = "system", types = ["python"], pass_filenames = false },
    { id = "tach", name = "tach architecture check", entry = "uv run tach check", language = "system", pass_filenames = false },
    { id = "zizmor", name = "workflow hardening scan", entry = "uv run zizmor --persona=regular .github/workflows", language = "system", files = "^\\.github/workflows/.*\\.ya?ml$", pass_filenames = false },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks" },
]

services:

  e-metaxy:
    image: ghcr.io/damvolkov/e-metaxy:latest
    container_name: e-metaxy
    hostname: e-metaxy
    restart: unless-stopped
    user: "1000:1000"
    # the host's loopback is the whole topology: it serves 127.0.0.1:45190 and calls back OpenHuman,
    # which itself runs on host network. a bridge net would black-hole the callback.
    network_mode: host
    labels:
      e-core.category: "bridge"
      e-core.port: "45190"
    volumes:
      # the subscription login, the session store and the hooks, at the paths they hold inside ~/.claude
      - ${HOME}/.claude:/home/damien/.claude
      - ${HOME}/.local/share/e-metaxy:/home/damien/.local/share/e-metaxy
      # the live nomos book, editable on the host; restart the unit to reread it
      - ${HOME}/workspaces/damien/e-metaxy/profiles.yaml:/app/profiles.yaml:ro
    env_file:
      - ../../e-metaxy/env
    environment:
      # override the host-absolute path the env file carries: the book is bind-mounted here
      - METAXY_PROFILES=/app/profiles.yaml
      - APP_ENV=prod
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 45190), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
